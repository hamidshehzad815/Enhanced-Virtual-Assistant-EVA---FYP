name: "🐛 Bug Report"
description: "Report something in the app that is broken or behaves wrong."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Fill this in while testing. The more exact your steps, the faster it gets fixed."

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What is wrong, in one or two sentences?"
      placeholder: "Sending a message crashes the app when there is no internet."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Exact steps, numbered."
      placeholder: |
        1. Open the app and log in
        2. Turn on airplane mode
        3. Open a chat and tap Send
        4. App closes
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected result"
      placeholder: "A 'No internet' error should show and the message stays in the box."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual result"
      placeholder: "The app crashes to the home screen."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / screen recording"
      description: "Drag images or a video here. Optional but very helpful."
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - "Critical - app crashes / data lost"
        - "High - feature unusable"
        - "Medium - works but wrong"
        - "Low - cosmetic / minor"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Device & OS"
      placeholder: "Samsung A52, Android 13  /  Pixel emulator, Android 14"
    validations:
      required: true
